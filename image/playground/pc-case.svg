<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" fill="none">
  <!-- Mid-Tower PC Case Frame -->
  <rect x="6" y="6" width="468" height="588" rx="14" fill="#0e0e0e" stroke="#343434" stroke-width="2"/>
  <!-- Top Exhaust Vent Mesh -->
  <line x1="80" y1="16" x2="400" y2="16" stroke="#262626" stroke-width="3" stroke-dasharray="8 6"/>
  <!-- Rear Exhaust Fan Frame -->
  <rect x="18" y="60" width="14" height="110" rx="3" fill="#171717" stroke="#2e2e2e" stroke-width="1.2"/>
  <!-- Cable Management Grommets -->
  <rect x="430" y="80" width="22" height="76" rx="4" fill="#141414" stroke="#262626" stroke-width="1.5"/>
  <rect x="430" y="190" width="22" height="76" rx="4" fill="#141414" stroke="#262626" stroke-width="1.5"/>
  <!-- Lower PSU Shroud Divider Line -->
  <line x1="12" y1="456" x2="468" y2="456" stroke="#343434" stroke-width="2"/>
</svg>
