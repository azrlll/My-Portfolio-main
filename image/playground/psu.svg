  <!-- Fan Grille Area -->
  <circle cx="56" cy="48" r="28" fill="#111111" stroke="#a3a3a3" stroke-width="1.8"/>
  <circle cx="56" cy="48" r="18" fill="none" stroke="#737373" stroke-width="1.2"/>
  <circle cx="56" cy="48" r="8" fill="#242424" stroke="#d4d4d4" stroke-width="1.5"/>
