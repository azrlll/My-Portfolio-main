<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Minimalist Monochrome Schematic Symbols Banner -->
  <rect x="2" y="2" width="316" height="76" rx="8" fill="#141414" stroke="#343434" stroke-width="1.5"/>
  <!-- Battery Symbol -->
  <g transform="translate(20, 20)" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="20" x2="14" y2="20"/>
    <line x1="14" y1="6" x2="14" y2="34"/>
    <line x1="22" y1="12" x2="22" y2="28" stroke-width="3"/>
    <line x1="22" y1="20" x2="36" y2="20"/>
  </g>
  <!-- Resistor Zigzag Symbol -->
  <g transform="translate(88, 20)" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="0,20 8,20 12,10 18,30 24,10 30,30 36,10 40,20 48,20"/>
  </g>
  <!-- Diode / LED Symbol -->
  <g transform="translate(168, 20)" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="20" x2="12" y2="20"/>
    <polygon points="12,10 12,30 28,20" fill="#252525" stroke="#F5F5F5"/>
    <line x1="28" y1="10" x2="28" y2="30"/>
    <line x1="28" y1="20" x2="40" y2="20"/>
  </g>
  <!-- NPN Transistor Symbol -->
  <g transform="translate(242, 16)" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="24" r="18" stroke="#343434" stroke-width="1.5"/>
    <line x1="6" y1="24" x2="18" y2="24"/>
    <line x1="18" y1="13" x2="18" y2="35"/>
    <line x1="18" y1="18" x2="30" y2="10"/>
    <line x1="18" y1="30" x2="30" y2="38"/>
  </g>
</svg>
