<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- CPU Substrate -->
  <rect x="14" y="14" width="92" height="92" rx="8" fill="#181818" stroke="#d4d4d4" stroke-width="2.5"/>
  <!-- Gold Corner Triangle (Pin 1 Indicator) -->
  <polygon points="20,98 20,86 32,98" fill="#e5e5e5"/>
  <!-- Alignment Notches -->
  <path d="M14 48 A5 5 0 0 1 14 58" fill="#0b0b0b" stroke="#d4d4d4" stroke-width="2"/>
  <path d="M106 48 A5 5 0 0 0 106 58" fill="#0b0b0b" stroke="#d4d4d4" stroke-width="2"/>
  <!-- Integrated Heat Spreader (IHS) -->
  <rect x="26" y="26" width="68" height="68" rx="6" fill="#262626" stroke="#f5f5f5" stroke-width="2"/>
  <rect x="34" y="34" width="52" height="52" rx="3" fill="#1f1f1f" stroke="#737373" stroke-width="1.2"/>
  <!-- Contact Pads / SMD Details -->
  <line x1="60" y1="18" x2="60" y2="23" stroke="#8c8c8c" stroke-width="2"/>
  <line x1="48" y1="18" x2="48" y2="23" stroke="#8c8c8c" stroke-width="2"/>
  <line x1="72" y1="18" x2="72" y2="23" stroke="#8c8c8c" stroke-width="2"/>
  <line x1="60" y1="97" x2="60" y2="102" stroke="#8c8c8c" stroke-width="2"/>
  <line x1="48" y1="97" x2="48" y2="102" stroke="#8c8c8c" stroke-width="2"/>
  <line x1="72" y1="97" x2="72" y2="102" stroke="#8c8c8c" stroke-width="2"/>
  <!-- Label -->
  <text x="60" y="57" text-anchor="middle" fill="#f5f5f5" font-family="monospace" font-size="12" font-weight="bold">CORE</text>
  <text x="60" y="71" text-anchor="middle" fill="#a3a3a3" font-family="monospace" font-size="9">CPU</text>
</svg>
